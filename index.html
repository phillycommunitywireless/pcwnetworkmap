<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Network Map | Philly Community Wireless</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet">
  <link href='https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.css" type="text/css">
  <link rel="stylesheet" href="./css/style.css">

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>
  <script src='https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js'></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.min.js"></script>
</head>

<body>
  <div id="loading">Loading...</div>
  <div id="map"></div>
  <div id="right-sidebar" class="sidebar right collapsed">

    <!-- Tab bar -->
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="tab-basic">Signal</button>
      <button class="sidebar-tab" data-tab="tab-links">Network</button>
      <button class="sidebar-tab" data-tab="tab-zones">Services</button>
    </div>

    <!-- Signal tab — heatmap + neighborhood outline -->
    <div class="sidebar-tab-panel active" id="tab-basic">
      <div class="section-label">Signal View</div>
      <div class="switch-super-container">
        <label class="switch-container txt-ms">
          <input type="checkbox" id="heatmap-layer" checked />
          <div class="switch mr6"></div>
          Heatmap
        </label>
        <label class="switch-container txt-ms">
          <input type="checkbox" id="neighborhood-outline-only" />
          <div class="switch mr6"></div>
          Neighborhoods
        </label>
      </div>
      <!-- Hidden: kept in DOM so bind-elements.util.js can read/set .checked -->
      <input type="checkbox" id="neighborhood-boundaries" style="display:none" />
    </div>

    <!-- Network tab — nodes, connections -->
    <div class="sidebar-tab-panel" id="tab-links">
      <div class="section-label">Nodes / AP</div>
      <div class="switch-super-container">
        <label class='switch-container txt-ms'>
          <input type='checkbox' id="layer1" checked />
          <div class="switch mr6"></div>
          <img class="layer-icon"
            src="https://raw.githubusercontent.com/phillycommunitywireless/pcwnetworkmap/main/icons/high_sites.png">
          High Sites
        </label>
        <label class='switch-container txt-ms'>
          <input type='checkbox' id="layer4" checked />
          <div class="switch mr6"></div>
          <img class="layer-icon"
            src="https://raw.githubusercontent.com/phillycommunitywireless/pcwnetworkmap/main/icons/Rooftophubs2.png">
          Main Router
        </label>
        <label class='switch-container txt-ms'>
          <input type='checkbox' id="layer2" checked />
          <div class="switch mr6"></div>
          <img class="layer-icon"
            src="https://raw.githubusercontent.com/phillycommunitywireless/pcwnetworkmap/main/icons/RooftopHub.png">
          Access Points
        </label>
        <label class='switch-container txt-ms'>
          <input type='checkbox' id="layer3" checked />
          <div class="switch mr6"></div>
          <img class="layer-icon"
            src="https://raw.githubusercontent.com/phillycommunitywireless/pcwnetworkmap/main/icons/icon1.png">
          Mesh Nodes
        </label>
      </div>

      <div class="section-label">Connections</div>
      <div class="switch-super-container">
        <label class="switch-container">
          <input type="checkbox" id="toggleNetworkLinks" disabled />
          <div class="switch"></div>
          <div class="ml6 txt-ms">High Sites to Routers</div>
        </label>
        <label class="switch-container">
          <input type="checkbox" id="toggleNetworkLinks4" disabled />
          <div class="switch"></div>
          <div class="ml6 txt-ms">Point-to-Point Bridge</div>
        </label>
        <label class="switch-container">
          <input type="checkbox" id="toggleNetworkLinks2" disabled />
          <div class="switch"></div>
          <div class="ml6 txt-ms">Routers to Wired APs</div>
        </label>
        <label class="switch-container">
          <input type="checkbox" id="toggleNetworkLinks3" disabled />
          <div class="switch"></div>
          <div class="ml6 txt-ms">Wired APs to Mesh Nodes</div>
        </label>
      </div>
    </div>

    <!-- Services tab — placeholder -->
    <div class="sidebar-tab-panel" id="tab-zones">
      <div class="section-label">Operations Zones</div>
      <p class="sidebar-coming-soon">Coming soon</p>
    </div>

    <!-- Persistent year slider — visible on all tabs -->
    <div class="sidebar-year-slider">
      <div class="section-label">Year: <span id="year-display">2025</span></div>
      <input
        type="range"
        id="select-year"
        name="select-year"
        min="2021"
        max="2025"
        value="2025"
        step="1"
        list="year-ticks" />
      <datalist id="year-ticks">
        <option value="2021"></option>
        <option value="2022"></option>
        <option value="2023"></option>
        <option value="2024"></option>
        <option value="2025"></option>
      </datalist>
      <div class="year-tick-labels">
        <span>2021</span>
        <span>2022</span>
        <span>2023</span>
        <span>2024</span>
        <span>2025</span>
      </div>
    </div>

    <button type="button" class="sidebar-toggle right" id="sidebar-toggle"></button>
  </div>
  <script type="module" src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>
  <script src="js/main.js" type="module"></script>
</body>

</html>
